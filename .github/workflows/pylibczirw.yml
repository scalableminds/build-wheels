name: pylibCZIrw

on:
  workflow_dispatch:
    inputs:
      pylibczirwVersion:
        description: "pylibCZIrw version"
        required: true
        default: "6.1.0"
      cibwVersion:
        description: "cibuildwheel version"
        default: "3.4.1"

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      CIBW_BUILD: "cp312-* cp313-* cp314-*"
      CIBW_VERSION: ${{ inputs.cibwVersion || '3.4.1'}}
      PYLIBCZIRW_VERSION: ${{ inputs.pylibczirwVersion || '6.1.0'}}
    strategy:
      matrix:
        # macos-15-intel is an intel runner, macos-15 is apple silicon
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-15]
      fail-fast: false
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download pylibCZIrw
        run: |
          curl -o pypi.json "https://pypi.org/pypi/pylibczirw/${PYLIBCZIRW_VERSION}/json"
          URL=$(python -c "import json, sys; print([u for u in json.load(sys.stdin)['urls'] if u['url'].endswith('.tar.gz')][0]['url'])" < pypi.json)
          curl -o pylibCZIrw.tar.gz $URL
          tar -xvf pylibCZIrw.tar.gz
          mv pylibczirw-${PYLIBCZIRW_VERSION} pylibczirw

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_ARCHS_MACOS: ${{ matrix.os == 'macos-15-intel' && 'x86_64' || 'arm64' }}
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          # manylinux2014 (CentOS 7) is too old for the ninja binary that vcpkg downloads
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          # pylibCZIrw's setup.py reads these to configure the CMake build on macOS
          CIBW_ENVIRONMENT_MACOS: ${{ matrix.os == 'macos-15-intel' && 'MACOSX_DEPLOYMENT_TARGET=10.15 CMAKE_OSX_ARCHITECTURES=x86_64' || 'MACOSX_DEPLOYMENT_TARGET=11.0 CMAKE_OSX_ARCHITECTURES=arm64' }}
        with:
           package-dir: ./pylibczirw
           output-dir: wheelhouse
           config-file: "pyproject.toml"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  publish:
    name: Publish wheels to pypi.scm.io
    needs: [build_wheels]
    runs-on: ubuntu-latest
    steps:
      - name: Get wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to pypy.scm.io
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: ${{ secrets.PYPI_SCM_USERNAME }}
          password: ${{ secrets.PYPI_SCM_PASSWORD }}
          repository-url: https://pypi.scm.io/simple/
          skip-existing: true
