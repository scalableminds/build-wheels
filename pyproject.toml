[tool.cibuildwheel]
skip = "*-musllinux*"
test-requires = ["pytest", "requests", "matplotlib"]
test-command = [
            "pytest {project}/tests"
            ]


[tool.cibuildwheel.linux]
# glibc-static is needed for the static OpenSSL build done by pylibCZIrw's setup.py
before-all = """
            yum install -y curl zip unzip tar glibc-static
            # full perl (not just perl-interpreter) for OpenSSL's Configure script, built by vcpkg for curl
            yum install -y perl perl-IPC-Cmd
            git clone https://github.com/microsoft/vcpkg /opt/vcpkg
            /opt/vcpkg/bootstrap-vcpkg.sh -disableMetrics
            """
environment = { VCPKG_INSTALLATION_ROOT = "/opt/vcpkg" }

[tool.cibuildwheel.windows]
# Clone vcpkg once to a fixed location.
# Must be a single line: cmd only runs the first line of a multi-line command.
before-all = "git clone https://github.com/microsoft/vcpkg C:/scm-vcpkg && C:\\scm-vcpkg\\bootstrap-vcpkg.bat -disableMetrics"
# Forward slashes: cibuildwheel's environment parsing strips backslashes (C:\vcpkg -> C:vcpkg)
environment = { VCPKG_INSTALLATION_ROOT = "C:/scm-vcpkg" }

[tool.cibuildwheel.macos]
# pylibCZIrw >= 6 uses Homebrew (not vcpkg) for its dependencies on macOS
before-all = "brew install eigen"

